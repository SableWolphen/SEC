name: SEC real-browser mobile audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Keep the latest check for a branch and cancel an obsolete run when a new
# commit arrives. Failed current runs still report normally.
concurrency:
  group: sec-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium:
    # Playwright 1.56 predates Ubuntu 26 runners (ubuntu-latest since Oct 19, 2026).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Audit every SEC screen at five responsive widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sec-visual-http.log 2>&1 &
          node scripts/browser-audit.cjs
      - name: Save anonymous browser audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-responsive-audit
          path: artifacts/sec-browser-audit/
          if-no-files-found: ignore
          retention-days: 7
