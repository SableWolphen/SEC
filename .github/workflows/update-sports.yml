name: Refresh SEC multi-season basketball and baseball schedules
on:
  schedule:
    - cron: '37 2,8,14,20 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/update_sports.py'
      - 'scripts/check-schedule-coverage.py'
      - 'tests/test_sports.py'
      - 'tests/test_schedule_coverage.py'
      - '.github/workflows/update-sports.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: sec-sports-feeds
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test real schedule parsing and team validation
        run: |
          python3 -m unittest discover -s tests -p test_sports.py -v
          python3 -m unittest discover -s tests -p test_schedule_coverage.py -v
      - name: Pull verified full-season matchups from ESPN
        run: python3 scripts/update_sports.py
      - name: Validate published schedules
        run: |
          python3 - <<'PY'
          import json,datetime as dt
          d=json.load(open('sports-schedules.json'))
          for sport in ('basketball','baseball'):
              season=d['sports'][sport]['season']
              ids=set()
              for g in d['sports'][sport]['games']:
                  assert g['sport']==sport and g['season']==season and g['id'] not in ids
                  ids.add(g['id'])
                  assert isinstance(g['source'],str) and g['source'].strip() and g['away_code']!=g['home_code']
                  assert g['game_status'] in ('scheduled','live','final','canceled')
                  assert g['winner_code'] is None or g['winner_code'] in (g['away_code'],g['home_code'])
                  assert dt.datetime.fromisoformat(g['kickoff_at'].replace('Z','+00:00')).tzinfo is not None
              print(sport, len(d['sports'][sport]['games']), 'public games,',d['sports'][sport].get('verified_database_games',0),'from verified database')
              if d['sports'][sport].get('source_windows',0) == 0:
                  print('::warning::All '+sport+' live schedule queries failed; historical verified fixtures retained.')
              if sport == 'basketball':
                  counts=d['sports'][sport].get('sec_team_game_counts',{})
                  low={team:count for team,count in counts.items() if count < 25}
                  if low:
                      print('::warning::SEC basketball schedule incomplete for '+str(len(low))+' schools: '+str(low))
                  coverage=d['sports'][sport].get('team_coverage',{})
                  if len(coverage) < 16:
                      print('::warning::Only '+str(len(coverage))+' of 16 individual SEC team schedule feeds responded.')
                  if d['sports'][sport].get('warning'):
                      print('::warning::'+d['sports'][sport]['warning'])
              if not d['sports'][sport]['games']:
                  print('::warning::No verified individual '+sport+' matchups available; retain existing fixture records and show the empty state.')
          print('Validated published sports schedule with secure-game IDs preserved')
          PY
      - name: Audit complete-season schedule coverage
        run: python3 scripts/check-schedule-coverage.py
      - name: Save coverage health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-schedule-coverage
          path: sports-schedule-health.json
          if-no-files-found: warn
          retention-days: 30
      - name: Track unresolved schedule gaps in GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f sports-schedule-health.json ]; then
            echo "::warning::Schedule health report unavailable; check prior workflow steps."
            exit 0
          fi
          TITLE="SEC schedule completeness alert"
          ISSUE="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "SEC schedule completeness alert") | .number' | head -n 1)"
          NEEDS_REVIEW="$(python3 -c 'import json; print(str(json.load(open("sports-schedule-health.json"))["needs_review"]).lower())')"
          if [ "$NEEDS_REVIEW" = true ]; then
            {
              echo "The automated SEC schedule audit found incomplete or unverified coverage."
              echo
              echo "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "Download the \`sec-schedule-coverage\` artifact for all 16 schools' counts."
              echo
              echo "Do not interpret missing matches as no games scheduled."
            } > /tmp/sec-schedule-alert.md
            if [ -z "$ISSUE" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/sec-schedule-alert.md
            fi
          elif [ -n "$ISSUE" ]; then
            gh issue close --repo "$GITHUB_REPOSITORY" "$ISSUE" --reason completed --comment "The latest schedule audit reports no active coverage gaps."
          fi
      - name: Publish updated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-schedules.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SEC basketball/baseball fixtures from ESPN [automated]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new fixtures"
          fi
