          node scripts/smoke-trophy-legacy.cjs
          node --check sec-champion-3d.js
          node --check scripts/smoke-champion-3d.cjs
          node scripts/smoke-champion-3d.cjs
          node --check scripts/smoke-championship-years.cjs
          node scripts/smoke-championship-years.cjs
          node --check config.js
          node --check sw.js
          node --check mobile/mobile-bridge.js
          node --check scripts/prepare-mobile.cjs
          node --check scripts/check-mobile.cjs
          npm run mobile:prepare
