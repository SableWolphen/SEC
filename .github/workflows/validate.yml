          node scripts/smoke-ai-commentary.cjs
          node --check scripts/smoke-fan-experience.cjs
          node scripts/smoke-fan-experience.cjs
          node --check sec-rankings.js
          node --check scripts/smoke-rankings.cjs
          node scripts/smoke-rankings.cjs
          python3 -m unittest discover -s tests -p test_rankings.py -v
          python3 -m py_compile scripts/update_rankings.py
          node --check team-records.js
          node --check scripts/smoke-team-records.cjs
          node scripts/smoke-team-records.cjs
          python3 -m unittest discover -s tests -p test_team_records.py -v
          python3 -m unittest discover -s tests -p test_sportradar_baseball.py -v
          python3 -m py_compile scripts/update_team_records.py scripts/sportradar_baseball.py
          node --check scripts/smoke-online.cjs
          node scripts/smoke-online.cjs
          node --check scripts/smoke-school-onboarding.cjs
          node scripts/smoke-school-onboarding.cjs
          node --check scripts/smoke-two-accounts.cjs
          node scripts/smoke-two-accounts.cjs
          python3 -m py_compile scripts/update_stats.py
          python3 - <<'PY'
          from pathlib import Path
          source=Path("index.html").read_text()
          assert "<script>" in source and "</script>" in source
          Path("/tmp/sec-inline.js").write_text(source.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/sec-inline.js
      - name: Validate schedule, manifest and multiplayer assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          html=Path("index.html").read_text()
          sql=Path("supabase/setup.sql").read_text()
          manifest=json.loads(Path("manifest.webmanifest").read_text())
          assert len(re.findall(r"\('2026-\d+-[A-Z0-9]+-[A-Z0-9]+'",sql)) == 120, "Expected all 120 regular-season games seeded"
          assert 'checking_member.user_id = (select auth.uid())' in sql, 'Standings authorization must qualify member user_id to avoid PL/pgSQL ambiguity'
          assert 'where league_id=p_league and user_id=auth.uid()' not in sql, 'Unqualified user_id breaks standings'
          assert 'where g0.id=new.game_id;' in sql, 'Pick guard must use a regular SELECT so authenticated users can save a pick'
          assert 'where id=new.game_id for share;' not in sql, 'FOR SHARE would require schedule update rights and break Pickem'
          assert 'id="news-view"' in html and 'data-nav="news"' in html, "News tab missing"
          assert './sec-news.js' in html and Path('sec-news.js').exists(), "News frontend missing"
          assert Path('.github/workflows/refresh-news.yml').exists(), "News updater missing"
          assert Path('scripts/update_news.py').exists(), "News extraction missing"
          headlines=json.loads(Path('news.json').read_text())
          assert isinstance(headlines.get('articles'),list), "Published news feed is invalid"
          assert all(isinstance(item.get('title'),str) and item.get('source') in ('NCAA','ESPN') for item in headlines['articles']), "Invalid news source record"
          assert 'id="sports-view"' in html and 'id="basketball-view"' in html and 'id="baseball-view"' in html, "All three sport pages required"
          assert './multi-sport.js' in html and Path('multi-sport.js').exists(), "Multi-sport client missing"
          assert Path('multi-sport.css').exists(), "Sports CSS missing"
          assert Path('sports-schedules.json').exists(), "Public sports schedule missing"
          assert Path('supabase/migrations/20261009_basketball_baseball.sql').exists(), "Isolated sport backend migration missing"
          assert Path('supabase/migrations/20261009_unified_three_sport_leagues.sql').exists(), "Unified club migration missing"
          assert Path('supabase/migrations/20261009_switchable_league_preferences.sql').exists(), "Switchable league preference migration missing"
          assert Path('supabase/migrations/20261009_secure_postseason_brackets.sql').exists(), "Secure postseason bracket migration missing"
          assert Path('supabase/migrations/20261009_per_league_sport_selection.sql').exists(), "Per-league sport settings migration missing"
          assert Path('supabase/migrations/20261009_weekly_power_rankings.sql').exists(), "Weekly power rankings migration missing"
          assert Path('supabase/functions/sec-sport-sync/index.ts').exists(), "Source-verified importer missing"
          assert "window.SEC_BRIDGE" in html
          assert "./config.js" in html and "./multiplayer.js" in html
          assert "./manifest.webmanifest" in html
          assert Path("sw.js").exists() and Path("icon.svg").exists()
          assert "./matchup-stats.js" in html and Path("stats.json").exists()
          assert "./league-features.js" in html and Path("league-features.js").exists()
          assert 'id="weekly-tiebreaker-slot"' in html, "Tiebreaker must appear on Picks screen"
          features=Path("league-features.js").read_text()
          assert 'pairings()+tiebreakerCard()' not in features, "Tiebreaker must not remain in League settings"
          assert 'id="sds-trophy-case"' in html and 'data-nav="trophies"' in html, "Trophy Case must be available in navigation"
          assert './trophy-case.js' in html and Path("trophy-case.js").exists(), "Missing Trophy Case asset"
          assert './rivalry-catalog.js' in html and Path('rivalry-catalog.js').exists(), "Archive script missing"
          assert html.index('./rivalry-catalog.js') < html.index('./trophy-case.js'), "Archive must load first"
          assert Path('supabase/migrations/20261009_73_rivalry_catalog.sql').exists(), "Expanded secure award migration missing"
          assert './league-social.js' in html and Path("league-social.js").exists(), "Missing social client"
          assert Path("supabase/migrations/20261009_trophies_chat_champions.sql").exists()
          assert "sec_league_standings_v3" in Path("multiplayer.js").read_text()
          modes=Path("supabase/migrations/20261009_four_modes.sql").read_text()
          for symbol in ("sec_save_league_pick","sec_h2h_history","sec_league_standings_v3","sec_revealed_league_picks","sec_rotate_league_invite","sec_week_tiebreakers"):
              assert symbol in modes, "Missing game mode database function/table: "+symbol
          import struct
          models=list(Path("trophies").glob("*.glb"))
          assert len(models)==15, f"Expected 15 real 3D GLB assets, found {len(models)}"
          for model in models:
              binary=model.read_bytes()
              magic,version,total=struct.unpack_from("<4sII",binary,0)
              assert magic==b"glTF" and version==2 and total==len(binary), model.name
              json_size,json_magic=struct.unpack_from("<II",binary,12)
              assert json_magic==0x4e4f534a, model.name
              gltf=json.loads(binary[20:20+json_size])
              assert gltf["asset"]["version"]=="2.0" and gltf["meshes"], model.name
          assert Path("supabase/enable-score-automation.sql").exists()
          assert Path("supabase/functions/sec-scores/index.ts").exists()
          data=json.loads(Path("stats.json").read_text())
          assert isinstance(data.get("games"),dict)
          assert manifest["display"] == "standalone"
          assert "service_role" not in Path("config.js").read_text().replace("// NEVER put a secret, service_role, or database password in this file.","")
          print("Verified 120 games, scripts, install manifest, and public client config.")
          PY
