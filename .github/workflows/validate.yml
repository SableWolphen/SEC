name: Verify SEC Pick'em
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Keep the latest check for a branch and cancel an obsolete run when a new
# commit arrives. Failed current runs still report normally.
concurrency:
  group: sec-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check multi-sport.js
          node --check sec-home.js
          node --check scripts/smoke-clean-navigation.cjs
          node scripts/smoke-clean-navigation.cjs
          node --check scripts/smoke-chat-refresh.cjs
          node scripts/smoke-chat-refresh.cjs
          node --check scripts/smoke-multi-sport.cjs
          node scripts/smoke-multi-sport.cjs
          node --check scripts/smoke-team-scores.cjs
          node scripts/smoke-team-scores.cjs
          python3 -m unittest discover -s tests -p test_sports.py -v
          python3 -m py_compile scripts/update_sports.py
          node --check multiplayer.js
          node --check league-features.js
          node --check scripts/smoke-tiebreakers.cjs
          node scripts/smoke-tiebreakers.cjs
          node --check rivalry-catalog.js
          node --check trophy-case.js
          node --check sec-news.js
          node --check scripts/smoke-news.cjs
          node scripts/smoke-news.cjs
          python3 -m unittest discover -s tests -p test_news.py -v
